version: '3.8'

networks:
  langfuse-net:
    external: true

services:
  langsmith-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langsmith-langfuse-proxy
    image: langsmith-langfuse-proxy:1.0.0
    # No ports published - n8n reaches this via service name "langsmith-proxy" on langfuse-net
    environment:
      # Server Configuration
      - SERVER_PORT=3001

      # Langfuse Configuration - reached by service name over the shared network
      - LANGFUSE_BASE_URL=http://langfuse-web:3000
      - LANGFUSE_INGESTION_ENDPOINT=/api/public/ingestion
      - LANGFUSE_PUBLIC_KEY=pk-lf-REDACTED
      - LANGFUSE_SECRET_KEY=sk-lf-REDACTED

      # Proxy Configuration
      - PROXY_LOG_REQUESTS=true
      - PROXY_LOG_RESPONSES=true
      - PROXY_TIMEOUT_SECONDS=30

      # JVM Options
      - JAVA_OPTS=-Xmx512m -Xms256m
      - SPRING_CONFIG_ADDITIONAL_LOCATION=file:/config/

    volumes:
      - ./logs:/app/logs
      - ./config:/config

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - langfuse-net

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
