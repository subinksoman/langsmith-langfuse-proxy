# ============================================================
# Server Configuration
# ============================================================
server.port=3001

# ============================================================
# Langfuse Configuration
# ============================================================
langfuse.base-url=http://10.0.13.74:3000
langfuse.ingestion-endpoint=/api/public/ingestion

# -- Default project credentials (catch-all) -----------------
# MUST use the default_projects keys so untagged requests
# go to the catch-all project, not crm/texttorule.
langfuse.public-key=${LANGFUSE_PUBLIC_KEY:}
langfuse.secret-key=${LANGFUSE_SECRET_KEY:}

# ============================================================
# Per-node project routing
# ============================================================
# Deliberately valueless. This file is packaged into the jar, so anything
# written here ships inside the published image and is readable by anyone who
# pulls it. Supply real credentials at runtime instead:
#
#   LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY        for the default project
#   SPRING_APPLICATION_JSON                          for the per-node map, e.g.
#     {"langfuse":{"projects":{"crm":{"public-key":"pk-lf-...","secret-key":"sk-lf-..."}}}}
#   or a mounted config/application.properties (see docker-compose.n8n.yml)

# "crm" node -> Langfuse "crm" project
# langfuse.projects.crm.public-key=<set via SPRING_APPLICATION_JSON or a mounted config>
# langfuse.projects.crm.secret-key=<set via SPRING_APPLICATION_JSON or a mounted config>

# "texttorule" node -> Langfuse "texttorule" project
# langfuse.projects.texttorule.public-key=<set via SPRING_APPLICATION_JSON or a mounted config>
# langfuse.projects.texttorule.secret-key=<set via SPRING_APPLICATION_JSON or a mounted config>

# "default_projects" - explicit entry (same as default above)
# langfuse.projects.default_projects.public-key=<set via SPRING_APPLICATION_JSON or a mounted config>
# langfuse.projects.default_projects.secret-key=<set via SPRING_APPLICATION_JSON or a mounted config>

# "mfs"
# langfuse.projects.mfs.public-key=<set via SPRING_APPLICATION_JSON or a mounted config>
# langfuse.projects.mfs.secret-key=<set via SPRING_APPLICATION_JSON or a mounted config>


# "Gen Ai - Virtual Profile Creation"
# Slug, not the display name: a property key containing spaces splits at the
# first space, so Spring tried to bind "langfuse.projects.gen" to a
# ProjectConfig and the application refused to start. Set the workflow's
# metadata node (or its "node:" tag) to this slug.
# langfuse.projects.genai_vp.public-key=<set via SPRING_APPLICATION_JSON or a mounted config>
# langfuse.projects.genai_vp.secret-key=<set via SPRING_APPLICATION_JSON or a mounted config>


# "CMS"
# langfuse.projects.CMS.public-key=<set via SPRING_APPLICATION_JSON or a mounted config>
# langfuse.projects.CMS.secret-key=<set via SPRING_APPLICATION_JSON or a mounted config>

# "upc"
# langfuse.projects.upc.public-key=<set via SPRING_APPLICATION_JSON or a mounted config>
# langfuse.projects.upc.secret-key=<set via SPRING_APPLICATION_JSON or a mounted config>

# "self_care"
# langfuse.projects.self_care.public-key=<set via SPRING_APPLICATION_JSON or a mounted config>
# langfuse.projects.self_care.secret-key=<set via SPRING_APPLICATION_JSON or a mounted config>

# "text_to_rule"
# langfuse.projects.text_to_rule.public-key=<set via SPRING_APPLICATION_JSON or a mounted config>
# langfuse.projects.text_to_rule.secret-key=<set via SPRING_APPLICATION_JSON or a mounted config>


# ============================================================
# Proxy Configuration
# ============================================================
proxy.log-requests=true
proxy.log-responses=true
proxy.timeout-seconds=30
proxy.max-connections=100
proxy.max-connections-per-route=20

# ============================================================
# Logging Configuration
# ============================================================
logging.level.root=INFO
logging.level.com.proxy=DEBUG
logging.level.com.proxy.config.LangfuseConfig=INFO
logging.level.org.springframework.web=INFO
logging.level.org.apache.hc.client5=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# ============================================================
# Multipart ingestion (/runs/multipart)
# ============================================================
# LangSmith allows batches up to 20MB; the Spring defaults of 1MB/10MB would
# reject a large trace before it ever reached the transformer.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ============================================================
# Trace context cache
# ============================================================
# A LangSmith PATCH carries the outputs, token usage and end time but often no
# trace_id, so the proxy remembers which trace and project each run id belongs
# to for this long.
proxy.trace-cache.ttl-minutes=180
proxy.trace-cache.max-entries=20000

# ============================================================
# Log file rotation
# ============================================================
# proxy.log rolls at this size (and daily), keeping maxHistory archives up to
# total-size-cap. Request/response payload logging is verbose, so the cap on
# the archive as a whole matters as much as the per-file limit.
logging.file.path=logs
logging.file.max-size=10MB
logging.file.max-history=30
logging.file.total-size-cap=500MB

# ============================================================
# Asynchronous delivery to Langfuse
# ============================================================
# n8n is answered 202 as soon as a batch is queued, instead of waiting for the
# Langfuse round trip. Transformation still happens on the request thread: it
# updates the correlation cache and depends on arrival order.
# Batches are partitioned across workers by project and each worker is
# single-threaded, so a project's batches keep the order they were transformed.
proxy.async.enabled=true
proxy.async.workers=4
proxy.async.queue-capacity=5000
proxy.async.max-retries=3
proxy.async.retry-backoff-millis=500
proxy.async.offer-timeout-millis=1000
proxy.async.shutdown-drain-seconds=20
