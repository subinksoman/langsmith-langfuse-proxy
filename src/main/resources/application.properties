# ============================================================
# Server Configuration
# ============================================================
server.port=3001

# ============================================================
# Langfuse Configuration
# ============================================================
langfuse.base-url=http://10.0.13.74:3000
langfuse.ingestion-endpoint=/api/public/ingestion

# -- Default project credentials (catch-all) -----------------
# MUST use the default_projects keys so untagged requests
# go to the catch-all project, not crm/texttorule.
langfuse.public-key=pk-lf-REDACTED
langfuse.secret-key=sk-lf-REDACTED

# ============================================================
# Per-node project routing
# ============================================================

# "crm" node -> Langfuse "crm" project
langfuse.projects.crm.public-key=pk-lf-REDACTED
langfuse.projects.crm.secret-key=sk-lf-REDACTED

# "texttorule" node -> Langfuse "texttorule" project
langfuse.projects.texttorule.public-key=pk-lf-REDACTED
langfuse.projects.texttorule.secret-key=sk-lf-REDACTED

# "default_projects" - explicit entry (same as default above)
langfuse.projects.default_projects.public-key=pk-lf-REDACTED
langfuse.projects.default_projects.secret-key=sk-lf-REDACTED

# "mfs"
langfuse.projects.mfs.public-key=pk-lf-REDACTED
langfuse.projects.mfs.secret-key=sk-lf-REDACTED


# "Gen Ai - Virtual Profile Creation"
# Slug, not the display name: a property key containing spaces splits at the
# first space, so Spring tried to bind "langfuse.projects.gen" to a
# ProjectConfig and the application refused to start. Set the workflow's
# metadata node (or its "node:" tag) to this slug.
langfuse.projects.genai_vp.public-key=pk-lf-REDACTED
langfuse.projects.genai_vp.secret-key=sk-lf-REDACTED


# "CMS"
langfuse.projects.CMS.public-key=pk-lf-REDACTED
langfuse.projects.CMS.secret-key=sk-lf-REDACTED

# "upc"
langfuse.projects.upc.public-key=pk-lf-REDACTED
langfuse.projects.upc.secret-key=sk-lf-REDACTED

# "self_care"
langfuse.projects.self_care.public-key=pk-lf-REDACTED
langfuse.projects.self_care.secret-key=sk-lf-REDACTED

# "text_to_rule"
langfuse.projects.text_to_rule.public-key=pk-lf-REDACTED
langfuse.projects.text_to_rule.secret-key=sk-lf-REDACTED


# ============================================================
# Proxy Configuration
# ============================================================
proxy.log-requests=true
proxy.log-responses=true
proxy.timeout-seconds=30
proxy.max-connections=100
proxy.max-connections-per-route=20

# ============================================================
# Logging Configuration
# ============================================================
logging.level.root=INFO
logging.level.com.proxy=DEBUG
logging.level.com.proxy.config.LangfuseConfig=INFO
logging.level.org.springframework.web=INFO
logging.level.org.apache.hc.client5=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# ============================================================
# Multipart ingestion (/runs/multipart)
# ============================================================
# LangSmith allows batches up to 20MB; the Spring defaults of 1MB/10MB would
# reject a large trace before it ever reached the transformer.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ============================================================
# Trace context cache
# ============================================================
# A LangSmith PATCH carries the outputs, token usage and end time but often no
# trace_id, so the proxy remembers which trace and project each run id belongs
# to for this long.
proxy.trace-cache.ttl-minutes=180
proxy.trace-cache.max-entries=20000

# ============================================================
# Log file rotation
# ============================================================
# proxy.log rolls at this size (and daily), keeping maxHistory archives up to
# total-size-cap. Request/response payload logging is verbose, so the cap on
# the archive as a whole matters as much as the per-file limit.
logging.file.path=logs
logging.file.max-size=10MB
logging.file.max-history=30
logging.file.total-size-cap=500MB
